<!DOCTYPE html>
<html>
<head>

<title>Recuperar contraseña</title>

<style>

body{
font-family:Arial;
background:#F5E6D3;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{

background:#FAF3EB;
padding:40px;
border-radius:10px;
width:350px;
box-shadow:0 10px 20px rgba(0,0,0,0.1);

}

button{

width:100%;
padding:10px;
background:#C97C5D;
border:none;
color:white;
font-weight:bold;
border-radius:5px;

}

</style>

</head>

<body>

<div class="card">

<h2>Recuperar contraseña</h2>

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<button>Enviar correo</button>

</form>

</div>

</body>
</html>
